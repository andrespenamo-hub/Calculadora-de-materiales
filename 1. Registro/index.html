<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scalable=1.0, minimum-scalable=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registro</title>
    <meta name="description" content="Pagina web del equipo de los FET-OS">
    <meta name="keywords" content="calculadora, materiales, construccion, calcular">
    <meta name="author" content="Los FET-OS">
    <link rel="shortcut icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <section>
            <div class="registro">
            <i class="fa-solid fa-bars"></i>
            <h1>Registro</h1>
            </div>
            <i class="user fa-solid fa-circle-user"></i>
            <form class="form-login" action"" method="post">
                <div class="bloques">
                    <i class="bloques-icons fa-solid fa-user-check"></i>
                    <input class="inputs" type="email" placeholder="Usuario" maxlength="50" minlength="4" title="Introduce tu email" pattern="[a-zA-Z0-9_]+([.][a-zA-Z0-9_]+)*@[a-zA-Z0-9_]+([.][a-zA-Z0-9_]+)*[.][a-zA-Z]{1,5}" required>
                </div>
                <div class="bloques">
                    <i class="bloques-icons fa-solid fa-key"></i>
                    <input class="inputs" type="password" placeholder="Contraseña" maxlength="25" minlength="8" title="Introduce tu contraseña" pattern="[0-9]{8,25}" required>
                </div>
                <div class="bloques">
                    <i class="bloques-icons fa-solid fa-lock"></i>
                    <input class="inputs" type="password" placeholder="Confirmar Contraseña" maxlength="25" minlength="8" title="Introduce tu contraseña" pattern="[0-9]{8,25}" required>
                </div>
                <input class="btn" type="submit" name="Entrar" value="Crear Cuenta">
                </form>
                <div>
                    <h1 class="cuenta">¿Ya tenés una cuenta?</h1>
                    <a href="file:///C:/Users/FELIPE_WRATS/Desktop/Tareas/Semestre%202/Interfaces%20I/Corte%202/Proyecto/2.%20Inicio%20de%20Sesión/inicio_de_sesión.html">Iniciar Sesión</a>
                </div>
        </section>
    </main>
</body>
</html>
