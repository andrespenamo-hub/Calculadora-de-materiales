<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scalable=1.0, minimum-scalable=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Olvidaste la Contraseña</title>
    <meta name="description" content="Pagina web del equipo de los FET-OS">
    <meta name="keywords" content="calculadora, materiales, construccion, calcular">
    <meta name="author" content="Los FET-OS">
    <link rel="shortcut icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <section>
            <img class="user" src="candado.png" alt="candado icon">
            <h1 class="titulo-texto">Recupera tu contraseña</h1>
            <p class="descripcion">Escribe tu correo o usuario y te enviaremos</p>
            <p class="descripcion">un enlace para restablecerla.</p>
            <form class="form-login" action"" method="post">
                <div class="bloques">
                    <img class="bloques-icons" src="user.png" alt="user icon">
                    <input class="inputs" type="email" placeholder="Email" maxlength="50" minlength="4" title="Introduce tu email" pattern="[a-zA-Z0-9_]+([.][a-zA-Z0-9_]+)*@[a-zA-Z0-9_]+([.][a-zA-Z0-9_]+)*[.][a-zA-Z]{1,5}" required>
                </div>
                <input class="btn" type="submit" name="Entrar" value="Enviar Enlace">
                </form>
        </section>
    </main>
</body>
</html>
